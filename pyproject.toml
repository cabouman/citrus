[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "citrus"
dynamic = ["version"]
description = "CITRUS: scatter-corrected cone-beam CT reconstruction with an LBTE source iteration scatter solver in the loop"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Jordan Houri", email = "jhouri@purdue.edu" },
    { name = "Charles A. Bouman" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "mbirtorch>=0.0.2,<0.2",  # verified on 0.0.2 and 0.1.2 (recon first_iteration / init_recon semantics)
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx", "sphinx_book_theme", "sphinx-copybutton", "sphinxext-opengraph", "sphinx_design"]
# XrayPhysics builds the cross-section library (C++ library: needs a C++ toolchain and CMake)
physics = ["xrayphysics @ git+https://github.com/kylechampley/XrayPhysics"]
# fused GPU kernels (optional: PyTorch paths are used without Triton)
gpu = [
    "triton; sys_platform == 'linux'",
    "triton-windows; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/cabouman/citrus"
Documentation = "https://purduecitrus.readthedocs.io"

[tool.setuptools.dynamic]
version = { attr = "citrus.__version__" }

[tool.setuptools.packages.find]
include = ["citrus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
