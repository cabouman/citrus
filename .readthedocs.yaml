# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

# The API pages mock torch, triton and mbirtorch (docs/source/conf.py), so the package is put on the path by conf.py
# and only the light requirements are installed (xraylib among them: the material catalogue reads its element data).
python:
   install:
   - requirements: docs/requirements.txt

sphinx:
   configuration: docs/source/conf.py
